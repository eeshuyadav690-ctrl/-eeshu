<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Ticket Booking System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🎟 Online Ticket Booking System</h1>
    </header>

    <div class="container">

        <div class="card">
            <h2>Select Movie</h2>

            <select id="movie">
                <option value="200">Avengers - ₹200</option>
                <option value="180">Jawan - ₹180</option>
                <option value="250">Pathaan - ₹250</option>
                <option value="220">KGF 2 - ₹220</option>
            </select>

            <br><br>

            <label>Number of Tickets</label>

            <input type="number" id="tickets" min="1" value="1">

            <br><br>

            <button onclick="calculatePrice()">Calculate Price</button>

            <h3 id="price"></h3>

        </div>

        <div class="card">

            <h2>Customer Details</h2>

            <input type="text" id="name" placeholder="Enter Name">

            <input type="email" id="email" placeholder="Enter Email">

            <button onclick="bookTicket()">Book Ticket</button>

        </div>

    </div>

    <div id="result"></div>

<script src="script.js"></script>

</body>
</html>
